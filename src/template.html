<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BattleShip</title>
</head>
<body>
  <h1>Battleship</h1>

  <div id="controls">
    <button id="randomBtn">Random Ships</button>
    <button id="startBtn">Start Game</button>
    <button id="resetBtn">Reset</button>
  </div>

  <div id="status"></div>

  <div class="boards">
    <div>
      <h2>Player</h2>
      <div id="player" class="board"></div>
    </div>

    <div>
      <h2>Enemy</h2>
      <div id="enemy" class="board"></div>
    </div>
  </div>
</body>
</html>
